# Stack Portainer (déploiement depuis le dépôt Git).
# Variables obligatoires dans Portainer : DISCORD_TOKEN, POSTGRES_PASSWORD (+ optionnelles ci-dessous).
# LiteLLM est facultatif : ajouter COMPOSE_PROFILES=litellm et LITELLM_MASTER_KEY pour le lancer.
name: meeting-bot

# Journaux Docker plafonnés (sinon ils grossissent sans limite sur le disque des enregistrements).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  bot:
    # stable : dernière version publiée (git tag v…). Épingler une version : BOT_TAG=1.2.0.
    # latest suit chaque push sur main : à réserver aux essais.
    image: ghcr.io/powange/meeting-recorder:${BOT_TAG:-stable}
    restart: unless-stopped
    logging: *logging
    # Le bot n'a besoin d'aucun privilège système, et n'écrit que dans /data (volume) et /tmp.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN requis}
      # Fuseau des tâches planifiées (purge de nuit…) et des journaux.
      TZ: ${TZ:-Europe/Paris}
      # Chiffre les clés d'API saisies dans /config (recommandé). Une phrase longue et aléatoire ;
      # la changer rend les clés déjà enregistrées illisibles (à ressaisir).
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      # Adresses que le bot a le droit d'appeler (transcription, LLM), séparées par des virgules :
      # noms, *.domaine, IP ou CIDR (ex. 192.168.0.0/24,*.tailnet). Vide : aucune restriction.
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-}
      # Mot de passe alphanumérique : il est inséré tel quel dans l'URL.
      DATABASE_URL: postgres://bot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@postgres:5432/meetingbot
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /data
      # Port interne du healthcheck (jamais publié) ; à changer seulement en cas de conflit.
      HEALTH_PORT: ${HEALTH_PORT:-3000}
      # Résumés : se règle dans /config → Résumé. À défaut, ces variables servent de valeur par
      # défaut (LiteLLM de la stack : http://litellm:4000/v1 ; Ollama : http://hôte:11434/v1).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # Avec LiteLLM : une clé virtuelle limitée au modèle « summary » (voir docs/ia.md) plutôt que la clé maîtresse.
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Stockages que chaque serveur Discord peut connecter (/config → Stockage) : applications OAuth
      # de l'opérateur, voir docs/stockage.md. Un service sans identifiant n'est pas proposé.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ONEDRIVE_CLIENT_ID: ${ONEDRIVE_CLIENT_ID:-}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-summary}
      # Décommenter pour utiliser un fichier de configuration (surcharges par serveur, etc.)
      # CONFIG_PATH: /app/config/config.yaml
    volumes:
      # Pistes audio des réunions (prévoir ~3,3 Mo / 10 min / participant, plus l'audio complet)
      - recordings:/data
      # Décommenter pour utiliser un fichier de configuration :
      # - ${CONFIG_DIR:-/srv/meeting-bot/config}:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s

  postgres:
    image: postgres:17.11
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meetingbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bot -d meetingbot']
      interval: 5s
      timeout: 3s
      retries: 10

  # Sauvegarde quotidienne de la base à heure fixe (format pg_dump « custom », compressé),
  # conservée 14 jours dans le volume « backups ». Rattrapée au démarrage si la dernière a plus
  # d'un jour. Le conteneur passe « unhealthy » dans Portainer si aucune sauvegarde n'a réussi
  # depuis 26 h.
  backup:
    image: postgres:17.11
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: bot
      PGDATABASE: meetingbot
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Paris}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        backup() {
          f=/backups/meetingbot-$$(date +%F-%H%M).dump
          if pg_dump --format=custom --no-owner --file="$$f.tmp" && mv "$$f.tmp" "$$f"; then
            date +%s > /backups/last-ok; echo "sauvegarde OK : $$f"
          else
            rm -f "$$f.tmp"; echo "SAUVEGARDE EN ÉCHEC" >&2
          fi
          find /backups -name 'meetingbot-*' -mtime +$$BACKUP_KEEP_DAYS -delete
        }
        if [ ! -f /backups/last-ok ] || [ $$(( $$(date +%s) - $$(cat /backups/last-ok) )) -gt 86400 ]; then backup; fi
        while true; do
          now=$$(date +%s); next=$$(date -d "today $$BACKUP_AT" +%s)
          [ "$$next" -le "$$now" ] && next=$$(date -d "tomorrow $$BACKUP_AT" +%s)
          sleep $$(( next - now ))
          backup
        done
    healthcheck:
      test: ['CMD-SHELL', 'test -f /backups/last-ok && [ $$(( $$(date +%s) - $$(cat /backups/last-ok) )) -lt 93600 ]']
      interval: 30m
      timeout: 5s
      start_period: 10m
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Facultatif (COMPOSE_PROFILES=offsite) : copie hors site, chaque nuit après la sauvegarde, des
  # volumes « backups » et « recordings » vers une destination rclone (NAS, Google Drive…). Les
  # fichiers supprimés ici sont gardés 30 jours dans <destination>/.supprimes avant d'être effacés.
  # rclone.conf à créer sur l'hôte (voir docs/exploitation.md). « unhealthy » sans copie réussie depuis 26 h.
  offsite:
    image: rclone/rclone:1.75.1
    profiles: [offsite]
    restart: unless-stopped
    logging: *logging
    environment:
      TZ: ${TZ:-Europe/Paris}
      OFFSITE_AT: ${OFFSITE_AT:-04:30}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      OFFSITE_KEEP_DELETED_DAYS: ${OFFSITE_KEEP_DELETED_DAYS:-30}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        [ -n "$$RCLONE_REMOTE" ] || { echo "RCLONE_REMOTE manquant (ex. nas:meeting-bot)" >&2; sleep 3600; exit 1; }
        copy() {
          ok=1
          for dir in backups recordings; do
            # Garde-fou : un volume vide (recréé par erreur) ne doit jamais vider la copie distante.
            if [ -z "$$(ls -A /data/$$dir 2>/dev/null)" ]; then echo "/data/$$dir vide : ignoré"; continue; fi
            rclone sync "/data/$$dir" "$$RCLONE_REMOTE/$$dir" --backup-dir "$$RCLONE_REMOTE/.supprimes/$$(date +%F)/$$dir" --exclude 'tmp/**' --exclude '*.tmp' || ok=0
          done
          rclone delete "$$RCLONE_REMOTE/.supprimes" --min-age "$${OFFSITE_KEEP_DELETED_DAYS}d" --rmdirs 2>/dev/null || true
          if [ $$ok = 1 ]; then date +%s > /tmp/last-ok; echo "copie hors site OK"; else echo "COPIE HORS SITE EN ÉCHEC" >&2; fi
        }
        copy
        while true; do
          now=$$(date +%s); next=$$(date -d "$$OFFSITE_AT" +%s)
          [ "$$next" -le "$$now" ] && next=$$((next + 86400))
          sleep $$((next - now))
          copy
        done
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/last-ok && [ $$(( $$(date +%s) - $$(cat /tmp/last-ok) )) -lt 93600 ]']
      interval: 30m
      timeout: 5s
      start_period: 2h
    volumes:
      - backups:/data/backups:ro
      - recordings:/data/recordings:ro
      # rclone.conf (créé avec « rclone config », voir docs/exploitation.md)
      - ${RCLONE_CONFIG_DIR:-/srv/meeting-bot/rclone}:/config/rclone

  # Facultatif : lancé seulement avec COMPOSE_PROFILES=litellm.
  litellm:
    image: ghcr.io/berriai/litellm:v1.106.6
    profiles: [litellm]
    restart: unless-stopped
    logging: *logging
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    volumes:
      # Fichier à créer sur l'hôte à partir de config/litellm.example.yaml
      - ${LITELLM_CONFIG:-/srv/meeting-bot/litellm.yaml}:/app/config.yaml:ro

volumes:
  backups:
  pgdata:
  recordings:
