name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Dernière 24.x publiée, pas celle en cache sur l'exécuteur (souvent en retard d'un correctif).
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      - name: Migrations à jour avec le schéma
        run: npx drizzle-kit check && npx drizzle-kit generate --name ci-check && git diff --exit-code -- drizzle

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Au niveau du job : un `if` d'étape ne voit pas l'env de sa propre étape.
    env:
      PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest : chaque push sur main (essais) ; stable + 1.2.3 : versions publiées (tag v*),
          # que suit la production.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      # L'image est d'abord poussée sous une étiquette propre au commit ; stable, la version et
      # latest ne sont posés qu'après l'analyse de vulnérabilités (étape « Étiquettes »).
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:build-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance (comment l'image a été construite) et inventaire des paquets, attachés à l'image.
          provenance: mode=max
          sbom: true
      # Failles critiques ayant un correctif : l'image ne reçoit ni stable ni sa version, et la
      # production n'est pas redéployée (pas même par un « Pull and redeploy » manuel).
      - name: Analyse de vulnérabilités (Trivy 0.74.0)
        run: >-
          docker run --rm aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
      # Analyse réussie : la même image (même empreinte, sans reconstruction) reçoit ses étiquettes.
      - name: Étiquettes (stable, version, latest, sha)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE"
      # Seulement pour une version publiée : un push sur main ne doit jamais couper une réunion en cours.
      - name: Déclencher le redéploiement Portainer
        if: startsWith(github.ref, 'refs/tags/v') && env.PORTAINER_WEBHOOK != ''
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK"
